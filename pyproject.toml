[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datalynx"
version = "0.1.0"
description = "Fast, extensible record matching and data reconciliation for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Milad Khoshdel" }]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.urls]
Repository = "https://github.com/Miladkhoshdel/datalynx"
Issues = "https://github.com/Miladkhoshdel/datalynx/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]